backend:
  name: github
  repo: zamuraitattoo/zamuraitattoo.github.io
  branch: main
  site_domain: zamuraitattoo.netlify.app

media_folder: "images"
public_folder: "/images"

collections:
  - name: "portfolio"
    label: "Portfolio & Studio"
    files:
      - name: "gallery"
        label: "Selected Masterworks Gallery"
        file: "data/gallery.json"
        fields:
          - label: "Gallery Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Tattoo Title", name: "title", widget: "string", hint: "e.g., Goddess Parvathi Realism"}
              - {label: "Category / Placement Label", name: "category", widget: "string", hint: "e.g., REALISTIC BLACK & GREY · FOREARM REALISM"}
              - {label: "Style Filter", name: "style", widget: "select", options: ["Black & Grey Realism", "Stipple Realism", "Fine Line", "Piercing"]}
              - {label: "Photo", name: "image", widget: "image"}
